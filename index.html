<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b21f3a">
  <meta name="description" content="An interactive English B2.1 course organised around the CEEDCV 2026–2027 programme.">
  <title>CEED B2.1 · English Path</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="CEED B2.1 home">
        <img src="assets/ceed-logo.png" alt="CEEDCV · Centre Específic d'Educació a Distància de la Comunitat Valenciana">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-copy"><strong>ENGLISH B2.1</strong><small>2026–2027 · Learning path</small></span>
      </a>
      <div class="top-meta"><span class="progress-label">YOUR PROGRESS</span><strong id="top-progress">0% complete</strong></div>
    </div>
  </header>

  <div class="course-navigation">
    <nav class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="primary-links">
        <button class="nav-link" data-view="home"><span aria-hidden="true">⌂</span> Home</button>
        <button class="nav-link" data-view="schedule"><span aria-hidden="true">▦</span> Year plan</button>
        <button class="nav-link" data-view="assessment"><span aria-hidden="true">◎</span> Tasks & exams</button>
      </div>
      <nav id="unit-nav" aria-label="Units"></nav>
    </nav>
  </div>

  <main id="main" tabindex="-1"></main>
  <footer class="footer">Materials created by Ana H. Iranzo with AI assistance</footer>

  <script src="course-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
